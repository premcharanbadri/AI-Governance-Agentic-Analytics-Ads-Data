name: generator-checks

# Regenerates all data at 5% scale and runs every audit on each push, in pipeline order.
# Pass 2's own audit runs twice: once on clean history, once after Pass 3 has planted its incidents.
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pass 1 - reference data
        run: python generator/reference.py --scale 0.05 --out data
      - name: Pass 1 checks
        run: python generator/check_reference.py --scale 0.05 --data data
      - name: Pass 2 - daily history (includes CPC spike and planted orders)
        run: python generator/history.py --scale 0.05 --out data
      - name: Pass 2 checks (clean history)
        run: python generator/check_history.py --scale 0.05 --data data
      - name: Pass 3 - delivery incidents (tracking outage, duplicates, Meta restatements and rename)
        run: python generator/incidents.py --scale 0.05 --out data
      - name: Pass 2 checks (after incidents)
        run: python generator/check_history.py --scale 0.05 --data data
      - name: Pass 3 checks
        run: python generator/check_incidents.py --scale 0.05 --data data
